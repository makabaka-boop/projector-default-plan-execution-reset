server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用回退（本应用只有一个入口，防御性配置）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
